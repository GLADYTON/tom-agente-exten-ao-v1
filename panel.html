<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CodeForge</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- TOPBAR -->
  <header class="app-topbar">
    <div class="brand-mark">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2" y="2" width="12" height="12" rx="2" stroke-linejoin="round"/>
        <rect x="18" y="2" width="12" height="12" rx="2" stroke-linejoin="round"/>
        <rect x="2" y="18" width="12" height="12" rx="2" stroke-linejoin="round"/>
        <rect x="18" y="18" width="12" height="12" rx="2" stroke-linejoin="round"/>
        <path d="M8 8h16M8 24h16" stroke-linecap="round"/>
      </svg>
      <div class="brand-dot"></div>
    </div>
    <div class="brand-text">
      <div class="brand-name">CodeForge</div>
      <div class="brand-status" id="topbar-status"></div>
    </div>
  </header>

  <!-- NAVEGAÇÃO POR ABAS -->
  <nav class="app-tabs" role="tablist">
    <button class="app-tab" data-view="chat" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-linejoin="round"/></svg>
      <span>Chat</span>
    </button>
    <button class="app-tab" data-view="github" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0112 6.8c.85 0 1.71.11 2.51.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.16.58.67.48A10.01 10.01 0 0022 12c0-5.52-4.48-10-10-10z"/></svg>
      <span>GitHub</span>
    </button>
    <button class="app-tab" data-view="repos" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      <span>Repo</span>
    </button>
    <button class="app-tab" data-view="history" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linejoin="round"/></svg>
      <span>Histórico</span>
    </button>
    <button class="app-tab" data-view="config" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span>Modelos</span>
    </button>
    <button class="app-tab" data-view="usage" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 3v18h18M7 14l4-4 4 4 6-6" stroke-linejoin="round"/></svg>
      <span>Uso</span>
    </button>
  </nav>

  <!-- MAIN VIEW -->
  <main id="view" class="view"></main>

  <!-- PAINEL SLIDE DE AGENTES -->
  <div id="agents-panel" class="slide-panel hidden">
    <div class="slide-panel-inner" id="agents-panel-inner"></div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
